# Poseidon-L finetune defaults for morphogenesis WT (2 velocity channels, 64x96).
# Pretrained weights: local HF snapshot under checkpoints/Poseidon-L/ (override via CLI).
_target_: walrus.models.ScOTWrapper
image_size: [64, 96]
patch_size: 4
num_channels: 2
num_out_channels: 2
embed_dim: 192
depths: [8, 8, 8, 8]
num_heads: [3, 6, 12, 24]
skip_connections: [2, 2, 2, 0]
window_size: 16
mlp_ratio: 4.0
qkv_bias: True
hidden_dropout_prob: 0.0
attention_probs_dropout_prob: 0.0
drop_path_rate: 0.1
hidden_act: gelu
use_absolute_embeddings: False
initializer_range: 0.02
layer_norm_eps: 1e-5
p: 1
channel_slice_list_normalized_loss: null
residual_model: convnext
use_conditioning: True
learn_residual: False
use_mask_token: False
# Launch script overrides this to the absolute local snapshot path.
from_pretrained: L
